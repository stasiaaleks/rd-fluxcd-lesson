apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-production
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./overlays/production
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure-controllers
  patches:
    - target:
        kind: Deployment
        name: course-app
      patch: |
        - op: remove
          path: /spec/replicas
