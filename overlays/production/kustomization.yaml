apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - namespace.yaml
  - ../../base
  - hpa.yaml

replicas:
  - name: course-app
    count: 3

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: course-app
  - path: dragonfly.yaml
    target:
      group: dragonflydb.io
      version: v1alpha1
      kind: Dragonfly
      name: dragonfly
